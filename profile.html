<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - Synapse</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="nav-brand"><i class="fas fa-chart-network"></i> SYNAPSE</a>
        <div class="nav-links">
            <a href="index.html">Dashboard</a>
            <a href="habits.html">Habits</a>
            <a href="stats.html">Stats</a>
            <a href="profile.html" class="active">Profile</a>
        </div>
    </nav>
    <div class="container" style="max-width: 600px;">
        <div class="page-title">
            <h1>IDENTITY</h1>
            <p>User Configuration & Settings</p>
        </div>
        <div class="card">
            <div class="profile-pic-wrapper">
                <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Synapse" alt="Avatar" class="avatar" id="avatarImg">
                <div class="avatar-overlay"><i class="fas fa-camera"></i></div>
                <input type="file" id="picInput" accept="image/*">
            </div>
            <h2 style="font-family: var(--font-heading); color: var(--text-main); text-align: center; margin-bottom: 25px;" id="displayName">Subject #001</h2>
            
            <div class="form-group">
                <label for="profName">Display Name</label>
                <input type="text" id="profName" placeholder="Enter your alias...">
            </div>
            <div class="form-group">
                <label for="profTarget">Ultimate Goal</label>
                <input type="text" id="profTarget" placeholder="e.g. Consistency in everything">
            </div>
            
            <div class="form-group" style="margin-top: 30px; border-top: 1px solid var(--border-color); padding-top: 20px;">
                <label for="reminderTime"><i class="fas fa-bell" style="color: var(--neon-orange);"></i> Daily Reminder Time</label>
                <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 10px;">Get a notification if you haven't completed a habit by this time.</p>
                <input type="time" id="reminderTime" style="color: white; width: auto; display: block;">
                <button class="btn" style="margin-top: 10px; font-size: 12px; padding: 6px 12px;" onclick="checkAndRequestNotification()">Allow Notifications</button>
            </div>

            <button class="btn btn-magenta" onclick="saveProfileData()"><i class="fas fa-save"></i> Save Configuration</button>
            <p id="saveMsg" style="color: var(--neon-green); text-align: center; margin-top: 15px; display: none; font-family: var(--font-heading);">Profile Updated!</p>
        </div>
    </div>
    <script src="app.js"></script>
    <script>
        const picInput = document.getElementById('picInput');
        const avatarImg = document.getElementById('avatarImg');
        
        function loadProfileData() {
            const savedAvatar = localStorage.getItem('synapse_avatar_b64');
            if(savedAvatar) avatarImg.src = savedAvatar;
            document.getElementById('profName').value = profile.name || '';
            document.getElementById('profTarget').value = profile.target || '';
            document.getElementById('reminderTime').value = profile.reminderTime || '';
            if(profile.name) document.getElementById('displayName').innerText = profile.name;
        }
        
        picInput.addEventListener('change', function() {
            const file = this.files[0];
            if(file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const base64Img = e.target.result;
                    avatarImg.src = base64Img;
                    localStorage.setItem('synapse_avatar_b64', base64Img);
                }
                reader.readAsDataURL(file);
            }
        });
        
        function saveProfileData() {
            profile.name = document.getElementById('profName').value;
            profile.target = document.getElementById('profTarget').value;
            profile.reminderTime = document.getElementById('reminderTime').value;
            
            saveData();
            
            if(profile.name) document.getElementById('displayName').innerText = profile.name;
            const msg = document.getElementById('saveMsg');
            msg.style.display = 'block';
            setTimeout(() => { msg.style.display = 'none'; }, 3000);
        }
        
        document.addEventListener("DOMContentLoaded", loadProfileData);
    </script>
</body>
</html>
