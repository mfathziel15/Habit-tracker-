<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habits - Synapse</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="nav-brand"><i class="fas fa-chart-network"></i> SYNAPSE</a>
        <div class="nav-links">
            <a href="index.html">Dashboard</a>
            <a href="habits.html" class="active">Habits</a>
            <a href="stats.html">Stats</a>
            <a href="profile.html">Profile</a>
        </div>
    </nav>
    <div class="container">
        <div class="page-title">
            <h1>DAILY PROTOCOLS</h1>
            <p>Manage your habits.</p>
        </div>
        <div class="card" style="max-width: 800px; margin: 0 auto;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h2 class="card-title" style="margin: 0;"><i class="fas fa-list-check"></i> Check-in</h2>
                <span style="color: var(--neon-magenta); font-family: var(--font-heading); font-weight: bold;">TODAY</span>
            </div>
            <div class="input-group">
                <input type="text" id="habitInput" placeholder="Initialize new habit (e.g. Workout, Coding)...">
                <button class="btn" onclick="addHabit()">Add</button>
            </div>
            <ul class="habit-list" id="habitList"></ul>
        </div>
    </div>
    <script src="app.js"></script>
    <script>
        function renderHabits() {
            const list = document.getElementById('habitList');
            list.innerHTML = '';
            habits.forEach((habit, index) => {
                const li = document.createElement('li');
                li.className = 'habit-item';
                li.innerHTML = `
                    <label class="habit-info">
                        <input type="checkbox" class="neon-checkbox" ${habit.completed ? 'checked' : ''} onchange="toggleHabit(${index})">
                        <span class="habit-text">${habit.name}</span>
                    </label>
                    <button class="btn-icon" onclick="deleteHabit(${index})"><i class="fas fa-times"></i></button>
                `;
                list.appendChild(li);
            });
        }
        function addHabit() {
            const input = document.getElementById('habitInput');
            const val = input.value.trim();
            if(val) {
                habits.push({ name: val, completed: false });
                input.value = '';
                saveData(); renderHabits(); updateStreakLogic(); 
            }
        }
        document.getElementById('habitInput').addEventListener('keypress', e => { if(e.key === 'Enter') addHabit(); });
        function toggleHabit(index) {
            habits[index].completed = !habits[index].completed;
            saveData(); renderHabits(); updateStreakLogic(); 
        }
        function deleteHabit(index) {
            habits.splice(index, 1);
            saveData(); renderHabits(); updateStreakLogic();
        }
        document.addEventListener("DOMContentLoaded", renderHabits);
    </script>
</body>
</html>
