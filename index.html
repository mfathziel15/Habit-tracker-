<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Synapse</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <!-- SPLASH SCREEN (Only on Dashboard) -->
    <div id="splash-screen">
        <h1 class="splash-logo"><i class="fas fa-chart-network"></i> SYNAPSE</h1>
        <div class="splash-text">INITIALIZING PROTOCOLS...</div>
    </div>

    <nav class="navbar">
        <a href="index.html" class="nav-brand"><i class="fas fa-chart-network"></i> SYNAPSE</a>
        <div class="nav-links">
            <a href="index.html" class="active">Dashboard</a>
            <a href="habits.html">Habits</a>
            <a href="stats.html">Stats</a>
            <a href="profile.html">Profile</a>
        </div>
    </nav>

    <div class="container" style="display: none;" id="main-content">
        <div class="page-title">
            <h1>DASHBOARD</h1>
            <p>System Overview <span id="currentDate"></span></p>
        </div>

        <div class="dashboard-grid">
            <div class="card">
                <h2 class="card-title"><i class="fas fa-bullseye"></i> Today's Progress</h2>
                <div class="progress-circle-container">
                    <div class="progress-circle" id="overallProgress" style="--p: 0deg;">
                        <div class="progress-value" id="progressText">0%</div>
                    </div>
                </div>
                <p style="text-align: center; color: var(--text-muted); font-size: 0.9rem;" id="progressSummary">Data loading...</p>
            </div>

            <div class="card streak-container" id="streakCard">
                <h2 class="card-title" style="justify-content: center; margin-bottom: 10px;"><i class="fas fa-fire-alt"></i> Daily Streak</h2>
                <i class="fas fa-fire fire-icon" id="streakFlame"></i>
                <div class="streak-number" id="streakNumber">0</div>
                <div class="streak-text">Days Streak</div>
                <div class="best-streak-badge" id="bestStreakBadge">Best: 0 Days</div>
                <p style="color: var(--text-muted); font-size: 0.85rem; margin-top: 15px;">Complete at least one habit today to fuel the fire!</p>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        // Splash Screen Logic
        window.addEventListener('load', () => {
            const splash = document.getElementById('splash-screen');
            const main = document.getElementById('main-content');
            
            // Only show splash if not already shown in this session
            if(!sessionStorage.getItem('splashShown')) {
                setTimeout(() => {
                    splash.style.opacity = '0';
                    splash.style.visibility = 'hidden';
                    main.style.display = 'block';
                    sessionStorage.setItem('splashShown', 'true');
                }, 2000);
            } else {
                splash.style.display = 'none';
                main.style.display = 'block';
            }
        });

        function triggerEmbers() {
            const flame = document.getElementById('streakFlame');
            if(!flame.classList.contains('active')) return;
            if(Math.random() > 0.8) {
                const ember = document.createElement('div');
                ember.className = 'ember';
                const rect = flame.getBoundingClientRect();
                ember.style.left = (rect.left + rect.width/2 + (Math.random()*20 - 10)) + 'px';
                ember.style.top = (rect.top + rect.height/2) + 'px';
                document.body.appendChild(ember);
                setTimeout(() => ember.remove(), 1500);
            }
            requestAnimationFrame(triggerEmbers);
        }

        function renderDashboard() {
            updateStreakLogic();
            document.getElementById('streakNumber').innerText = stats.streak;
            document.getElementById('bestStreakBadge').innerText = `Best: ${stats.bestStreak} Days`;
            const flame = document.getElementById('streakFlame');
            
            if (stats.history.includes(todayStr)) {
                flame.classList.add('active');
                triggerEmbers();
            } else {
                flame.classList.remove('active');
            }

            const total = habits.length;
            const completed = habits.filter(h => h.completed).length;
            const percentage = total === 0 ? 0 : Math.round((completed / total) * 100);
            
            const degrees = (percentage / 100) * 360;
            document.getElementById('overallProgress').style.setProperty('--p', `${degrees}deg`);
            document.getElementById('progressText').innerText = `${percentage}%`;

            const summary = document.getElementById('progressSummary');
            if(percentage === 0) summary.innerText = "System online. Awaiting action.";
            else if(percentage < 50) summary.innerText = "Processing tasks. Keep going.";
            else if(percentage < 100) summary.innerText = "Efficiency optimal. Almost done.";
            else summary.innerText = "All systems nominal. Goals achieved. 🚀";
        }

        document.addEventListener("DOMContentLoaded", renderDashboard);

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>
</body>
</html>
