<!DOCTYPE html>
<html lang="en">
    <!-- PWA Links -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#090b14">
<script>
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js')
        .then(() => console.log('Service Worker Terdaftar!'))
        .catch(err => console.log('Service Worker Gagal:', err));
    }
</script>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Futuristic Habit Tracker</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js for pro analytics -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

    <!-- NAVBAR -->
    <nav class="navbar">
        <a href="index.html" class="nav-brand">
            <i class="fas fa-chart-network"></i> SYNAPSE TRACKER
        </a>
        <div class="nav-links">
            <a href="index.html" class="active">Dashboard</a>
            <a href="profile.html">Profile</a>
        </div>
    </nav>

    <div class="container">
        <div class="page-title">
            <h1>HABIT TRACKER</h1>
            <p>Track. Improve. Transform. <span id="currentDate"></span></p>
        </div>

        <div class="dashboard-grid">
            
            <!-- LEFT COLUMN: ANALYTICS -->
            <div class="analytics-col">
                <!-- Overall Progress -->
                <div class="card" style="margin-bottom: 25px;">
                    <h2 class="card-title"><i class="fas fa-bullseye"></i> Overall Progress</h2>
                    <div class="progress-circle-container">
                        <div class="progress-circle" id="overallProgress" style="--p: 0deg;">
                            <div class="progress-value" id="progressText">0%</div>
                        </div>
                    </div>
                    <p style="text-align: center; color: var(--text-muted); font-size: 0.9rem;" id="progressSummary">Initialize your first habit.</p>
                </div>

                <!-- Monthly Overview Chart -->
                <div class="card">
                    <h2 class="card-title"><i class="fas fa-chart-line"></i> Monthly Overview</h2>
                    <div class="chart-wrapper">
                        <canvas id="monthlyChart"></canvas>
                    </div>
                </div>
            </div>

            <!-- RIGHT COLUMN: HABITS & CALENDAR -->
            <div class="habits-col">
                
                <!-- Daily Habit Tracker -->
                <div class="card" style="margin-bottom: 25px;">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                        <h2 class="card-title" style="margin: 0;"><i class="fas fa-list-check"></i> Daily Habits</h2>
                        <span style="color: var(--neon-magenta); font-family: var(--font-heading);">TODAY</span>
                    </div>

                    <!-- Custom Mode Input -->
                    <div class="input-group">
                        <input type="text" id="habitInput" placeholder="Initialize new protocol (e.g., Workout, Reading)...">
                        <button class="btn" onclick="addHabit()">Add</button>
                    </div>

                    <ul class="habit-list" id="habitList">
                        <!-- JS renders here -->
                    </ul>
                </div>

                <!-- Lifetime Calendar -->
                <div class="card">
                    <h2 class="card-title"><i class="fas fa-calendar-alt"></i> Lifetime Consistency</h2>
                    <div style="display: flex; gap: 15px; font-size: 12px; color: var(--text-muted); margin-bottom: 10px;">
                        <span><div class="day-box" style="display:inline-block; width:12px; height:12px; vertical-align:middle; margin-right:5px;"></div> Void</span>
                        <span><div class="day-box day-lvl-1" style="display:inline-block; width:12px; height:12px; vertical-align:middle; margin-right:5px;"></div> Low</span>
                        <span><div class="day-box day-lvl-3" style="display:inline-block; width:12px; height:12px; vertical-align:middle; margin-right:5px;"></div> High</span>
                    </div>
                    <div class="calendar-grid" id="calendarGrid">
                        <!-- JS renders here -->
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script>
        // --- 1. SET CURRENT DATE ---
        const dateOptions = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        document.getElementById('currentDate').innerText = " | " + new Date().toLocaleDateString('en-US', dateOptions);

        // --- 2. HABIT LOGIC (LOCALSTORAGE) ---
        let habits = JSON.parse(localStorage.getItem('futuristic_habits')) || [
            { name: "Morning Workout", completed: false },
            { name: "Read 20 pages", completed: false },
            { name: "Code for 1 hour", completed: false }
        ];

        function renderHabits() {
            const list = document.getElementById('habitList');
            list.innerHTML = '';
            
            habits.forEach((habit, index) => {
                const li = document.createElement('li');
                li.className = 'habit-item';
                
                li.innerHTML = `
                    <label class="habit-info">
                        <input type="checkbox" class="neon-checkbox" ${habit.completed ? 'checked' : ''} onchange="toggleHabit(${index})">
                        <span class="habit-text">${habit.name}</span>
                    </label>
                    <button class="btn-icon" onclick="deleteHabit(${index})"><i class="fas fa-times"></i></button>
                `;
                list.appendChild(li);
            });

            updateProgress();
            saveData();
        }

        function addHabit() {
            const input = document.getElementById('habitInput');
            const val = input.value.trim();
            if(val) {
                habits.push({ name: val, completed: false });
                input.value = '';
                renderHabits();
            }
        }

        document.getElementById('habitInput').addEventListener('keypress', e => {
            if(e.key === 'Enter') addHabit();
        });

        function toggleHabit(index) {
            habits[index].completed = !habits[index].completed;
            renderHabits();
        }

        function deleteHabit(index) {
            habits.splice(index, 1);
            renderHabits();
        }

        function updateProgress() {
            const total = habits.length;
            const completed = habits.filter(h => h.completed).length;
            const percentage = total === 0 ? 0 : Math.round((completed / total) * 100);
            
            // Update Circle UI
            const degrees = (percentage / 100) * 360;
            document.getElementById('overallProgress').style.setProperty('--p', `${degrees}deg`);
            document.getElementById('progressText').innerText = `${percentage}%`;

            // Update Summary Text
            const summary = document.getElementById('progressSummary');
            if(percentage === 0) summary.innerText = "System online. Awaiting action.";
            else if(percentage < 50) summary.innerText = "Processing tasks. Keep going.";
            else if(percentage < 100) summary.innerText = "Efficiency optimal. Almost done.";
            else summary.innerText = "All systems nominal. Goals achieved. 🚀";
        }

        function saveData() {
            localStorage.setItem('futuristic_habits', JSON.stringify(habits));
        }

        // --- 3. CHART.JS (MONTHLY OVERVIEW MOCKUP) ---
        const ctx = document.getElementById('monthlyChart').getContext('2d');
        
        // Gradient for line
        let gradient = ctx.createLinearGradient(0, 0, 0, 200);
        gradient.addColorStop(0, 'rgba(0, 243, 255, 0.5)');
        gradient.addColorStop(1, 'rgba(0, 243, 255, 0.0)');

        new Chart(ctx, {
            type: 'line',
            data: {
                labels: ['W1', 'W2', 'W3', 'W4', 'W5', 'W6'],
                datasets: [{
                    label: 'Completion Rate',
                    data: [40, 65, 50, 85, 70, 95],
                    borderColor: '#00f3ff',
                    backgroundColor: gradient,
                    borderWidth: 2,
                    pointBackgroundColor: '#ff00ea',
                    pointBorderColor: '#fff',
                    fill: true,
                    tension: 0.4
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: {
                    y: { 
                        beginAtZero: true, max: 100,
                        grid: { color: 'rgba(255, 255, 255, 0.05)' },
                        ticks: { color: '#8b9bb4' }
                    },
                    x: {
                        grid: { display: false },
                        ticks: { color: '#8b9bb4' }
                    }
                }
            }
        });

        // --- 4. LIFETIME CALENDAR (GITHUB-STYLE) ---
        function generateCalendar() {
            const grid = document.getElementById('calendarGrid');
            for(let i = 0; i < 365; i++) {
                const box = document.createElement('div');
                box.className = 'day-box';
                
                // Randomize intensity for futuristic visual
                const rand = Math.random();
                if(rand > 0.85) box.classList.add('day-lvl-3');
                else if(rand > 0.6) box.classList.add('day-lvl-2');
                else if(rand > 0.4) box.classList.add('day-lvl-1');
                
                grid.appendChild(box);
            }
        }

        // Init
        renderHabits();
        generateCalendar();
    </script>
</body>
</html>
