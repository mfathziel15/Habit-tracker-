<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Synapse Tracker</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="nav-brand"><i class="fas fa-chart-network"></i> SYNAPSE</a>
        <div class="nav-links">
            <a href="index.html" class="active">Dashboard</a>
            <a href="habits.html">Daily Habits</a>
            <a href="profile.html">Profile</a>
        </div>
    </nav>

    <div class="container">
        <div class="page-title">
            <h1>DASHBOARD</h1>
            <p>System Overview <span id="currentDate"></span></p>
        </div>

        <div class="dashboard-grid">
            <!-- OVERALL PROGRESS -->
            <div class="card">
                <h2 class="card-title"><i class="fas fa-bullseye"></i> Today's Progress</h2>
                <div class="progress-circle-container">
                    <div class="progress-circle" id="overallProgress" style="--p: 0deg;">
                        <div class="progress-value" id="progressText">0%</div>
                    </div>
                </div>
                <p style="text-align: center; color: var(--text-muted); font-size: 0.9rem;" id="progressSummary">Data loading...</p>
            </div>

            <!-- DAILY STREAK (DUOLINGO STYLE) -->
            <div class="card streak-container">
                <h2 class="card-title" style="justify-content: center; margin-bottom: 10px;"><i class="fas fa-fire-alt"></i> Daily Streak</h2>
                <i class="fas fa-fire fire-icon" id="streakFlame"></i>
                <div class="streak-number" id="streakNumber">0</div>
                <div class="streak-text">Days Streak</div>
                <p style="color: var(--text-muted); font-size: 0.85rem; margin-top: 15px;">Complete at least one habit today to fuel the fire!</p>
            </div>

            <!-- MONTHLY OVERVIEW (CHART) -->
            <div class="card full-width">
                <h2 class="card-title"><i class="fas fa-chart-line"></i> Activity Overview</h2>
                <div style="position: relative; height: 250px; width: 100%;">
                    <canvas id="monthlyChart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        function renderDashboard() {
            // Update Streak
            updateStreakLogic();
            document.getElementById('streakNumber').innerText = stats.streak;
            const flame = document.getElementById('streakFlame');
            
            // Check if today is completed to light the fire
            if (stats.history.includes(todayStr)) {
                flame.classList.add('active');
            } else {
                flame.classList.remove('active');
            }

            // Update Progress Circle
            const total = habits.length;
            const completed = habits.filter(h => h.completed).length;
            const percentage = total === 0 ? 0 : Math.round((completed / total) * 100);
            
            const degrees = (percentage / 100) * 360;
            document.getElementById('overallProgress').style.setProperty('--p', `${degrees}deg`);
            document.getElementById('progressText').innerText = `${percentage}%`;

            const summary = document.getElementById('progressSummary');
            if(percentage === 0) summary.innerText = "System online. Awaiting action.";
            else if(percentage < 50) summary.innerText = "Processing tasks. Keep going.";
            else if(percentage < 100) summary.innerText = "Efficiency optimal. Almost done.";
            else summary.innerText = "All systems nominal. Goals achieved. 🚀";
        }

        document.addEventListener("DOMContentLoaded", () => {
            renderDashboard();

            // CHART.JS Setup
            const ctx = document.getElementById('monthlyChart').getContext('2d');
            let gradient = ctx.createLinearGradient(0, 0, 0, 250);
            gradient.addColorStop(0, 'rgba(0, 243, 255, 0.4)');
            gradient.addColorStop(1, 'rgba(0, 243, 255, 0.0)');

            // Fake chart data for visual aesthetic (You can replace this with real history later)
            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'],
                    datasets: [{
                        label: 'Consistency',
                        data: [20, 50, 40, 80, 60, 90, 100],
                        borderColor: '#00f3ff',
                        backgroundColor: gradient,
                        borderWidth: 2,
                        pointBackgroundColor: '#ff00ea',
                        fill: true,
                        tension: 0.4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: { display: false }, // Hide Y axis for cleaner look
                        x: { grid: { display: false }, ticks: { color: '#8b9bb4' } }
                    }
                }
            });
        });

        // PWA Registration
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>
</body>
</html>
