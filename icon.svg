<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
    <!-- Background Putih -->
    <rect width="512" height="512" fill="#ffffff" rx="112" />
    
    <!-- Grup Huruf H dengan efek miring (futuristik) -->
    <g transform="skewX(-15) translate(80, 0)">
        <!-- Tiang Kiri (Warna Gelap Tema Web) -->
        <path d="M 150 120 L 210 120 L 210 392 L 150 392 Z" fill="#090b14" />
        
        <!-- Tiang Kanan (Warna Gelap Tema Web) -->
        <path d="M 320 120 L 380 120 L 380 392 L 320 392 Z" fill="#090b14" />
        
        <!-- Jembatan Tengah (Neon Cyan) -->
        <path d="M 210 216 L 320 216 L 320 276 L 210 276 Z" fill="#00f3ff" />
        
        <!-- Aksen Bayangan Bawah Kiri (Neon Magenta) -->
        <path d="M 210 276 L 270 276 L 270 392 L 210 392 Z" fill="#ff00ea" />
    </g>
</svg>
